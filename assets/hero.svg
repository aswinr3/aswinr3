<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1c2a24"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#3ddc97" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity=".08"/>
    </linearGradient>
  </defs>

  <style>
    .t{font:15px Consolas,'JetBrains Mono','Fira Code',monospace;fill:#d4dcd8}
    .p{fill:#3ddc97}
    .m{fill:#6b7f76}
    .cv{fill:#0f1714;transform-box:fill-box;transform-origin:right;animation:rv linear both}
    @keyframes rv{to{transform:scaleX(0)}}
    .cur{fill:#3ddc97;opacity:0;animation:blink 1s step-end 6.8s infinite}
    @keyframes blink{0%{opacity:1}50%{opacity:0}}
    .scan{animation:sc 5s linear infinite}
    @keyframes sc{from{transform:translateY(-80px)}to{transform:translateY(320px)}}
    .ring{fill:none;stroke:#3ddc97;stroke-opacity:.35;stroke-dasharray:4 6}
    .spin{transform-origin:640px 160px;animation:sp 40s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
  </style>

  <!-- background -->
  <rect width="820" height="320" rx="14" fill="#0a0f0d"/>
  <rect width="820" height="320" rx="14" fill="url(#dots)"/>

  <!-- terminal -->
  <rect x="20" y="20" width="440" height="280" rx="10" fill="#0f1714" stroke="#1f2d27"/>
  <circle cx="42" cy="42" r="5" fill="#3ddc97"/>
  <circle cx="60" cy="42" r="5" fill="#2a3a33"/>
  <circle cx="78" cy="42" r="5" fill="#2a3a33"/>
  <text x="240" y="47" text-anchor="middle" class="t m" style="font-size:12px">~/aswin — zsh</text>
  <line x1="20" y1="62" x2="460" y2="62" stroke="#1f2d27"/>

  <g xml:space="preserve">
    <text x="40" y="100" class="t" textLength="72"><tspan class="p">$</tspan> whoami</text>
    <rect x="40" y="86" width="72" height="20" class="cv" style="animation-duration:.6s;animation-delay:.5s;animation-timing-function:steps(8)"/>

    <text x="40" y="128" class="t" textLength="324">Aswin Rajasekar · full-stack builder</text>
    <rect x="40" y="114" width="324" height="20" class="cv" style="animation-duration:.9s;animation-delay:1.3s;animation-timing-function:steps(36)"/>

    <text x="40" y="166" class="t" textLength="135"><tspan class="p">$</tspan> cat stack.txt</text>
    <rect x="40" y="152" width="135" height="20" class="cv" style="animation-duration:.8s;animation-delay:2.5s;animation-timing-function:steps(15)"/>

    <text x="40" y="194" class="t m" textLength="306">Bun  Hono  React  Postgres  Docker</text>
    <rect x="40" y="180" width="306" height="20" class="cv" style="animation-duration:.9s;animation-delay:3.5s;animation-timing-function:steps(34)"/>

    <text x="40" y="232" class="t" textLength="126"><tspan class="p">$</tspan> ./ship --now</text>
    <rect x="40" y="218" width="126" height="20" class="cv" style="animation-duration:.8s;animation-delay:4.7s;animation-timing-function:steps(14)"/>

    <text x="40" y="260" class="t p" textLength="252">deploying ideas → production</text>
    <rect x="40" y="246" width="252" height="20" class="cv" style="animation-duration:1s;animation-delay:5.7s;animation-timing-function:steps(28)"/>
  </g>
  <rect x="298" y="247" width="9" height="17" class="cur"/>

  <!-- orbit system -->
  <circle cx="640" cy="160" r="95" fill="url(#glow)"/>
  <g class="spin">
    <g transform="translate(640 160) rotate(-25)">
      <ellipse rx="130" ry="42" class="ring"/>
      <circle r="5" fill="#3ddc97">
        <animateMotion dur="6s" repeatCount="indefinite" path="M130,0 A130,42 0 1,1 -130,0 A130,42 0 1,1 130,0"/>
      </circle>
    </g>
    <g transform="translate(640 160) rotate(35)">
      <ellipse rx="115" ry="36" class="ring"/>
      <circle r="4" fill="#d4dcd8">
        <animateMotion dur="8s" repeatCount="indefinite" path="M-115,0 A115,36 0 1,0 115,0 A115,36 0 1,0 -115,0"/>
      </circle>
    </g>
    <g transform="translate(640 160) rotate(90)">
      <ellipse rx="100" ry="30" class="ring"/>
      <circle r="3.5" fill="#3ddc97">
        <animateMotion dur="4.5s" repeatCount="indefinite" path="M100,0 A100,30 0 1,1 -100,0 A100,30 0 1,1 100,0"/>
      </circle>
    </g>
  </g>

  <!-- pulsing core -->
  <circle cx="640" cy="160" r="30" fill="none" stroke="#3ddc97">
    <animate attributeName="r" values="30;72" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".7;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="160" r="30" fill="#0f1714" stroke="#3ddc97" stroke-width="2"/>
  <text x="640" y="166" text-anchor="middle" class="t p" style="font-size:18px;font-weight:700">AR</text>

  <!-- scan line -->
  <rect width="820" height="80" fill="url(#scan)" class="scan"/>
</svg>

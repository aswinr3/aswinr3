<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21262d"/></pattern>
    <radialGradient id="glow"><stop offset="0" stop-color="#3fb950" stop-opacity=".22"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="820" height="320" rx="12"/></clipPath>
  </defs>
  <style>
    .t{font:16px Consolas,'SF Mono',Menlo,'JetBrains Mono',monospace}
    .cv{fill:#161b22;transform-box:fill-box;transform-origin:right;animation:rv linear both}
    @keyframes rv{to{transform:scaleX(0)}}
    .cur{fill:#3fb950;opacity:0;animation:blink 1s step-end 6.9s infinite}
    @keyframes blink{0%{opacity:1}50%{opacity:0}}
    .ring{fill:none;stroke:#7d8590;stroke-opacity:.55;stroke-width:1.2}
    .spin{animation:sp 30s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="820" height="320" fill="#0d1117"/>
    <rect width="820" height="320" fill="url(#dots)"/>

    <rect x="20.5" y="20.5" width="440" height="280" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle cx="42" cy="42" r="6" fill="#ff5f57"/><circle cx="62" cy="42" r="6" fill="#febc2e"/><circle cx="82" cy="42" r="6" fill="#28c840"/>
    <text x="240" y="46" text-anchor="middle" class="t" style="font-size:12px" fill="#7d8590">~/aswin &#8212; zsh</text>
    <line x1="21" y1="62.5" x2="460" y2="62.5" stroke="#30363d"/>
    <g xml:space="preserve">
        <text x="40" y="100" class="t" textLength="72" lengthAdjust="spacing"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
    <rect x="38" y="85" width="76" height="21" class="cv" style="animation-duration:0.6s;animation-delay:0.5s;animation-timing-function:steps(8)"/>
    <text x="40" y="128" class="t" textLength="342" lengthAdjust="spacing"><tspan fill="#e6edf3">Aswin Rajasekar &#183; full-stack developer</tspan></text>
    <rect x="38" y="113" width="346" height="21" class="cv" style="animation-duration:1.0s;animation-delay:1.3s;animation-timing-function:steps(38)"/>
    <text x="40" y="166" class="t" textLength="135" lengthAdjust="spacing"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">cat stack.txt</tspan></text>
    <rect x="38" y="151" width="139" height="21" class="cv" style="animation-duration:0.8s;animation-delay:2.6s;animation-timing-function:steps(15)"/>
    <text x="40" y="194" class="t" textLength="342" lengthAdjust="spacing"><tspan fill="#7d8590">React  Next  Bun  Hono  Rust  Postgres</tspan></text>
    <rect x="38" y="179" width="346" height="21" class="cv" style="animation-duration:1.0s;animation-delay:3.6s;animation-timing-function:steps(38)"/>
    <text x="40" y="232" class="t" textLength="126" lengthAdjust="spacing"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">./ship --now</tspan></text>
    <rect x="38" y="217" width="130" height="21" class="cv" style="animation-duration:0.8s;animation-delay:4.9s;animation-timing-function:steps(14)"/>
    <text x="40" y="260" class="t" textLength="252" lengthAdjust="spacing"><tspan fill="#3fb950">deploying ideas &#8594; production</tspan></text>
    <rect x="38" y="245" width="256" height="21" class="cv" style="animation-duration:1.0s;animation-delay:5.9s;animation-timing-function:steps(28)"/>
    </g>
    <rect x="295" y="247" width="9" height="17" class="cur"/>

    <circle cx="640" cy="160" r="110" fill="url(#glow)"/>
    <g transform="translate(640 160)">
      <g class="spin"><g transform="rotate(0)"><ellipse rx="120" ry="44" class="ring"/><circle r="5" fill="#3fb950"><animateMotion dur="6s" begin="-0s" repeatCount="indefinite" path="M120,0 A120,44 0 1,1 -120,0 A120,44 0 1,1 120,0"/></circle></g><g transform="rotate(60)"><ellipse rx="120" ry="44" class="ring"/><circle r="5" fill="#58a6ff"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite" path="M120,0 A120,44 0 1,1 -120,0 A120,44 0 1,1 120,0"/></circle></g><g transform="rotate(120)"><ellipse rx="120" ry="44" class="ring"/><circle r="5" fill="#e6edf3"><animateMotion dur="6s" begin="-4s" repeatCount="indefinite" path="M120,0 A120,44 0 1,1 -120,0 A120,44 0 1,1 120,0"/></circle></g></g>
      <circle r="28" fill="none" stroke="#3fb950">
        <animate attributeName="r" values="28;70" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".6;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="28" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <text y="8" text-anchor="middle" class="t" style="font-size:22px;font-weight:700" fill="#3fb950">A</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="819" height="319" rx="12" fill="none" stroke="#30363d"/>
</svg>
